name: Auto Update Master Playlist

on:
  schedule:
    # Har 1 ghante mein run karne ke liye
    - cron: '0 * * * *'
  workflow_dispatch: # Manual run ke liye

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Requests Library
        run: pip install requests

      - name: Run Merge Script
        run: python update_playlist.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "bot@github.com"
          git add playlist.m3u
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update master playlist [skip ci]" && git push)
